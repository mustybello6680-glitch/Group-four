<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect | Login</title>

    <link rel="stylesheet" href="style/login.css">

</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>CampusConnect</h1>

            <p>Student Login</p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Registration Number</label>

                    <input
                        type="text"
                        id="regno"
                        placeholder="FCP/CSE/22/1085"
                        required>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required>

                </div>

                <button
                    type="button"
                    onclick="loginUser()">

                    Login

                </button>

            </form>

            <div class="register-link">

                Don't have an account?

                <a href="register.html">

                    Register Here

                </a>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
